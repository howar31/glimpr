name: Bug report / 問題回報
description: Something does not work as expected. / 功能未如預期運作。
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Fill in what you can; the Diagnostics block is the part that saves the most back-and-forth.
        感謝回報。能填多少填多少；「診斷資訊」是最能減少來回追問的部分。
  - type: dropdown
    id: platform
    attributes:
      label: Platform / 平台
      options:
        - macOS
        - Windows
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics / 診斷資訊
      description: |
        Settings > About > Report an issue: the block is filled in automatically when you open this form from the app, or press "Copy diagnostics" and paste it here.
        設定 > 關於 > 回報問題：從 app 開啟本表單時會自動帶入；或按「複製診斷資訊」後貼到這裡。
      render: text
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 重現步驟
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected / 預期結果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual / 實際結果
      description: Attach a screenshot or recording if it helps. / 有截圖或錄影請一併附上。
    validations:
      required: true
