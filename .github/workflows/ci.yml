name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Classifies the change set so a documentation-only change skips the build
  # jobs. Documentation = every changed path matches the list in the script;
  # anything else, an empty diff or an unresolvable base counts as code and
  # runs the full suite. The `ci` job below stays the single required check.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -u
          code=true
          range=""
          if [ "$EVENT" = "pull_request" ]; then
            base="$(git merge-base "origin/$BASE_REF" HEAD 2>/dev/null || true)"
            [ -n "$base" ] && range="$base HEAD"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE HEAD"
          fi
          if [ -n "$range" ]; then
            # shellcheck disable=SC2086
            files="$(git diff --name-only $range)"
            if [ -n "$files" ]; then
              code=false
              while IFS= read -r f; do
                case "$f" in
                  *.md|docs/*|.github/ISSUE_TEMPLATE/*|.github/PULL_REQUEST_TEMPLATE.md|LICENSE) ;;
                  *) code=true ;;
                esac
              done <<< "$files"
            fi
          fi
          echo "range=${range:-none}"
          echo "code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  mac:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          ls /Applications | grep -i 'xcode' || true
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # The repo's Debug config signs with the local dev certificate (TCC
      # stability); CI has no certificates, so generate the Flutter configs
      # only and let xcodebuild build + test with ad-hoc signing overrides.
      - run: flutter build macos --debug --config-only
      - name: Build app + run macOS native tests (ad-hoc signed)
        run: |
          cd macos
          xcodebuild test -workspace Runner.xcworkspace -scheme Runner \
            -configuration Debug -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO

  windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --debug
      - name: Windows native tests (glimpr_tests)
        shell: cmd
        run: |
          cmake --build build\windows\x64 --target glimpr_tests --config Debug
          build\windows\x64\test\Debug\glimpr_tests.exe

  # The single required status check for main. Passes only when the
  # classification succeeded and every build job either succeeded or was
  # skipped because the change was documentation-only; a failed or cancelled
  # job fails it.
  ci:
    needs: [changes, mac, windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          MAC: ${{ needs.mac.result }}
          WINDOWS: ${{ needs.windows.result }}
        run: |
          echo "changes=$CHANGES code=$CODE mac=$MAC windows=$WINDOWS"
          [ "$CHANGES" = "success" ] || exit 1
          for r in "$MAC" "$WINDOWS"; do
            case "$r" in
              success) ;;
              skipped) [ "$CODE" = "false" ] || exit 1 ;;
              *) exit 1 ;;
            esac
          done
